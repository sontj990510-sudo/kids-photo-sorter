name: Deploy Giving Tree role demo

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify isolated static demo
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/.nojekyll
          test -f site/demo-manifest.webmanifest
          test ! -d site/face-models
          ! find site -type f \( -name '*.map' -o -name '*.ts' -o -name '*.tsx' \) -print -quit | grep -q .
          ! grep -R -E 'https://[a-z0-9-]+\.supabase\.co|sb_publishable_|/auth/v1/|/realtime/v1/|sourceMappingURL=' site

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Require the organization root Pages address
        shell: bash
        run: test -z "${{ steps.pages.outputs.base_path }}"

      - name: Upload role demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

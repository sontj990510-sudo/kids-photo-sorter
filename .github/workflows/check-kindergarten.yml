name: Check Kindergarten Prototype

on:
  push:
    branches:
      - develop/kindergarten-app
      - agent/kindergarten-*
    paths:
      - kindergarten-app/**
      - .github/workflows/check-kindergarten.yml
  pull_request:
    paths:
      - kindergarten-app/**
      - .github/workflows/check-kindergarten.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kindergarten-app/package-lock.json

      - name: Install
        working-directory: kindergarten-app
        run: npm ci

      - name: Lint and build
        working-directory: kindergarten-app
        run: npm run lint && npm run build
